<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>代码表白</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            background-color: #FFB6C1;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5);
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }
        #start-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

    <button id="start-btn">点击启动表白动画</button>
    <audio id="bgm" src="1.mp3" loop="false"></audio>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgm = document.getElementById('bgm');
        const startBtn = document.getElementById('start-btn');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. 歌词时间轴
        const LYRICS = [
            { start: 0.00,  end: 3.70,  text: "你掐灭没吸的烟" },
            { start: 3.70,  end: 7.72,  text: "大步流星地掠过我向前" },
            { start: 7.72,  end: 11.16, text: "我用力去抓你的衣角" },
            { start: 11.16, end: 14.49, text: "以为我挽留你结局就会改变" },
            { start: 14.49, end: 16.64, text: "你不说一句就要离开" },
            { start: 16.64, end: 18.65, text: "我在原地喊了又喊" },
            { start: 18.65, end: 21.82, text: "你不回头仿佛就当我不存在" },
            { start: 21.82, end: 23.80, text: "我的故事里只有你" },
            { start: 23.80, end: 25.66, text: "你走得迫不及待" },
            { start: 25.66, end: 30.87, text: "剩下来的情节 全是无奈" },
            { start: 30.87, end: 35.81, text: "竟是空白" }
        ];

        // 2. 文案和颜色配置
        const MESSAGES = [
            "好好吃饭", "多喝热水", "别熬夜", "保持好心情", "我想你了",
            "好好爱自己", "天凉了多加衣服", "喜欢你", "天天开心", "你是我的光",
            "想在你身边", "抱抱你", "别难过", "要开心哦", "你是最棒的",
            "想你陪着我", "我最偏爱你", "今天也想见你", "心心念念", "岁岁平安",
            "余生都是你", "想陪你过冬", "满眼都是你", "今天比昨天更喜欢你", "慢慢喜欢你",
            "你是我的人间理想", "岁岁常欢愉", "万事皆胜意", "朝朝暮暮", "你是我的偏爱"
        ];
        const COLORS = ["#FFB6C1", "#ADD8E6", "#90EE90", "#FFFFFF", "#FFC0CB", "#87CEEB", "#E0FFFF", "#FFFACD", "#D8BFD8", "#FFE4B5"];

        // 3. 动画状态变量
        let heartPoints = [];       // 心形坐标点
        let heartNotes = [];        // 已画出的心形便签记录（用于倒退消失）
        let floatPoints = [];       // 铺满坐标点
        let isFloatStarted = false;
        
        let currentLyricIndex = 0;
        let currentDisplayedLyric = "";
        
        let heartState = "waiting"; // waiting, drawing, erasing, filling
        let heartDrawIndex = 0;
        let fillDrawIndex = 0;
        let lastTime = 0;

        // 4. 初始化心形坐标
        function initHeartPoints() {
            heartPoints = [];
            const cx = W / 2;
            const cy = H / 2;
            const scale = Math.min(W, H) / 34;

            for (let i = 0; i < 240; i++) {
                const t = (i / 240) * 2 * Math.PI;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                
                const screenX = cx + x * scale;
                const screenY = cy - y * scale;
                
                // 每个点生成两个带有微小偏移的便签
                for (let j = 0; j < 2; j++) {
                    const offsetX = Math.floor(Math.random() * 31) - 15;
                    const offsetY = Math.floor(Math.random() * 31) - 15;
                    const px = Math.max(0, Math.min(screenX + offsetX, W - 100));
                    const py = Math.max(0, Math.min(screenY + offsetY, H - 45));
                    heartPoints.push({ x: px, y: py });
                }
            }
            // 打乱顺序
            heartPoints.sort(() => Math.random() - 0.5);
        }

        // 5. 初始化铺满坐标
        function initFloatPoints() {
            floatPoints = [];
            const stepX = 60;
            const stepY = 30;
            const cols = Math.floor(W / stepX) + 1;
            const rows = Math.floor(H / stepY) + 1;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let x = c * stepX + (Math.floor(Math.random() * 31) - 15);
                    let y = r * stepY + (Math.floor(Math.random() * 31) - 15);
                    x = Math.max(0, Math.min(x, W - 100));
                    y = Math.max(0, Math.min(y, H - 45));
                    floatPoints.push({ x: x, y: y });
                }
            }
            floatPoints.sort(() => Math.random() - 0.5);
        }

        // 6. 绘制单个便签
        function drawNote(x, y) {
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
            const w = 100;
            const h = 45;

            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);

            ctx.fillStyle = "black";
            ctx.font = "bold 10px 'Microsoft YaHei'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(msg, x + w/2, y + h/2);
        }

        // 7. 主循环
        function animate() {
            requestAnimationFrame(animate);
            const currentTime = bgm.currentTime;
            if (currentTime < 0) return;

            // 清屏
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, W, H);

            // 1. 歌词更新
            if (currentLyricIndex < LYRICS.length) {
                const lyric = LYRICS[currentLyricIndex];
                if (currentTime >= lyric.start && currentTime < lyric.end) {
                    if (currentDisplayedLyric !== lyric.text) {
                        currentDisplayedLyric = lyric.text;
                    }
                } else if (currentTime >= lyric.end) {
                    currentDisplayedLyric = "";
                    currentLyricIndex++;
                }
            }

            // 绘制歌词
            if (currentDisplayedLyric !== "") {
                ctx.fillStyle = "#FFE4E1";
                ctx.font = "bold 28px 'Microsoft YaHei'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(currentDisplayedLyric, W/2, H/2 + 200);
            }

            // 2. 心形动画绘制状态机
            if (heartState === "drawing") {
                // 每次画 2 个
                for (let i = 0; i < 2; i++) {
                    if (heartDrawIndex < heartPoints.length) {
                        const p = heartPoints[heartDrawIndex];
                        drawNote(p.x, p.y);
                        heartNotes.push({ x: p.x, y: p.y });
                        heartDrawIndex++;
                    }
                }
            } 
            else if (heartState === "erasing") {
                // 每次擦除 6 个（倒序擦除）
                for (let i = 0; i < 6; i++) {
                    if (heartNotes.length > 0) {
                        heartNotes.pop(); // 移除记录，下一帧重绘时就不画它了
                    }
                }
            }
            else if (heartState === "filling") {
                // 每次铺满 4 个
                for (let i = 0; i < 4; i++) {
                    if (fillDrawIndex < floatPoints.length) {
                        const p = floatPoints[fillDrawIndex];
                        drawNote(p.x, p.y);
                        fillDrawIndex++;
                    }
                }
            }

            // 重新绘制心形阶段中还没擦除的便签
            if (heartState === "erasing" || (heartState === "waiting" && heartNotes.length > 0)) {
                for (const note of heartNotes) {
                    drawNote(note.x, note.y);
                }
            }

            // 3. 时间轴触发逻辑
            // 23.80秒：开始画心
            if (currentTime >= 23.80 && heartState === "waiting") {
                heartState = "drawing";
            }
            // 31.48秒：心形画完，开始倒退消失
            if (heartState === "drawing" && heartDrawIndex >= heartPoints.length) {
                heartState = "erasing";
            }
            // 32.44秒：心形消失完毕，进入全黑等待
            if (heartState === "erasing" && heartNotes.length === 0) {
                heartState = "black_wait";
            }
            // 35.81秒：歌词消失的瞬间，立刻触发全屏铺满
            if (currentTime >= 35.81 && heartState !== "filling") {
                heartState = "filling";
                initFloatPoints(); // 初始化铺满坐标
                fillDrawIndex = 0;
            }
        }

        // 8. 启动按钮逻辑
        startBtn.addEventListener('click', function() {
            // 必须由用户交互触发音频播放
            bgm.play().then(() => {
                startBtn.style.display = 'none';
                // 重置所有状态
                initHeartPoints();
                heartNotes = [];
                heartDrawIndex = 0;
                heartState = "waiting";
                fillDrawIndex = 0;
                isFloatStarted = false;
                currentLyricIndex = 0;
                currentDisplayedLyric = "";
                // 开始动画循环
                requestAnimationFrame(animate);
            }).catch(error => {
                console.log("播放失败，请检查1.mp3文件是否存在", error);
                alert("播放失败，请检查目录下是否存在 1.mp3 文件！");
            });
        });

        // 监听音频结束
        bgm.addEventListener('ended', () => {
            // 音乐结束后，继续铺满的动画会自然继续，因为 requestAnimationFrame 仍在运行
            // 最终铺满结束，画面会静止
        });

    </script>
</body>
</html>
